services:
  - type: web
    name: tienda-yogurt-backend
    runtime: rust
    plan: free
    buildCommand: cargo build --release
    startCommand: ./target/release/tienda_yogurt_api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yogurt_db
          property: connectionString
      - key: PORT
        value: 10000

databases:
  - name: yogurt_db
    plan: free
    
